name: Deploy to Firebase

# Firebase project: bth-gwix-operator-network
# FTP deploy remains separate (deploy-to-ftp.yml)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "COMPLETE_BACKUP/**"
      - "content-materials/**"
      - "02_SHARED_SERVICES/**"
      - ".github/workflows/deploy-to-ftp.yml"
  workflow_dispatch:

concurrency:
  group: bth-firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy hosting & backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require FIREBASE_SERVICE_ACCOUNT
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add repository secret FIREBASE_SERVICE_ACCOUNT (service account JSON)"
            exit 1
          fi

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            functions:
              - 'functions/**'
            rules:
              - 'firestore.rules'
              - 'firestore.indexes.json'
            hosting:
              - '**'
              - '!functions/**'
              - '!firestore.rules'
              - '!firestore.indexes.json'
              - '!.github/**'
              - '!**/*.md'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        if: steps.filter.outputs.functions == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci
        working-directory: functions

      - name: Deploy to Firebase
        run: |
          PARTS=()
          if [ "${{ steps.filter.outputs.hosting }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PARTS+=("hosting")
          fi
          if [ "${{ steps.filter.outputs.functions }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PARTS+=("functions")
          fi
          if [ "${{ steps.filter.outputs.rules }}" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PARTS+=("firestore:rules" "firestore:indexes")
          fi
          if [ ${#PARTS[@]} -eq 0 ]; then
            PARTS=("hosting")
          fi
          ONLY=$(IFS=,; echo "${PARTS[*]}")
          echo "Deploying: --only ${ONLY}"
          # --force accepts Artifact Registry cleanup-policy setup so CI does not fail after a successful deploy
          npx -y firebase-tools@latest deploy --only "${ONLY}" --project bth-gwix-operator-network --non-interactive --force
